name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  build-test:
    name: build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.4'
          cache: false

      # gofmt is build-tag-agnostic, unlike golangci-lint's formatter pass,
      # which only analyses packages loaded under the default tag set. Without
      # this step, files behind //go:build e2e (and any future tagged files)
      # escape the format gate entirely.
      - name: gofmt (all files, including build-tagged)
        run: |
          out=$(gofmt -s -l .)
          if [ -n "$out" ]; then
            echo "files not gofmt'd:" && echo "$out" && exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: unit tests
        run: go test ./... -race -count=1 -timeout 120s -coverprofile=coverage.out

      # Gate: total statement coverage must not regress below the floor. Set
      # below the current level (~85%) with headroom for normal fluctuation;
      # raise the floor as coverage improves. Prevents silent erosion.
      - name: enforce coverage floor
        run: |
          min=83.0
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "total coverage: ${pct}% (floor: ${min}%)"
          awk -v p="$pct" -v m="$min" 'BEGIN { exit (p+0 >= m+0) ? 0 : 1 }' || {
            echo "::error::total coverage ${pct}% is below the required floor of ${min}%"
            exit 1
          }

      - name: upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.out

  integration-test:
    name: integration tests
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.4'
          cache: false

      - name: integration tests
        run: go test ./tests/integration/... -tags integration -race -count=1 -timeout 60s

  fuzz-short:
    name: fuzz (short, every PR)
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.4'
          cache: false

      # Short fuzz pass per target — ~30s each — runs on every push / PR.
      # Catches regressions introduced alongside other changes. The nightly
      # workflow (fuzz-nightly) runs each target for ~10 min to exercise the
      # coverage-guided engine more thoroughly.
      - name: fuzz parsers
        run: |
          set -uo pipefail
          # Only a GENUINE crasher fails this job (#143, same fix as the nightly
          # job's #107/#126). On a loaded runner a 30s fuzztime pass can exit with
          # a benign "context deadline exceeded" and no crasher — that must NOT
          # red the PR. -timeout has generous headroom over -fuzztime so the test
          # deadline never races the fuzz deadline; we fail only when Go actually
          # wrote a minimised crashing input ("Failing input written") or panicked.
          crash=0
          for pkg in bgp fdb ospf mpls lldp snmp; do
            FUZZ_TARGETS=$(go test -list 'Fuzz.*' "./internal/discovery/$pkg" | grep '^Fuzz')
            for t in $FUZZ_TARGETS; do
              echo "▼ $pkg.$t"
              if out=$(go test -run=NONE -fuzz="^$t\$" -fuzztime=30s -timeout=2m "./internal/discovery/$pkg" 2>&1); then
                printf '%s\n' "$out"
                continue
              fi
              printf '%s\n' "$out"
              if printf '%s\n' "$out" | grep -qE 'Failing input written|^[[:space:]]*panic:'; then
                echo "::error::fuzz crash found in $pkg.$t — crasher written to testdata/fuzz/"
                crash=1
              elif printf '%s\n' "$out" | grep -q 'context deadline exceeded'; then
                echo "::warning::$pkg.$t reached the fuzztime deadline with no crasher (benign); continuing"
              else
                echo "::error::$pkg.$t fuzz run failed for a non-crash reason (build/setup); investigate"
                crash=1
              fi
            done
          done
          exit "$crash"

      - name: upload fuzz corpus on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-corpus-failure
          path: internal/discovery/*/testdata/fuzz/**

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.4'
          cache: false

      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.12

  govulncheck:
    name: vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.4'
          cache: false

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4 # v1.1.4

      - name: govulncheck
        run: govulncheck ./...

  license-check:
    name: license compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.4'
          cache: false

      - name: install go-licenses
        run: go install github.com/google/go-licenses@v1.6.0 # v1.6.0

      # Fails the build if any dependency carries a forbidden or unidentifiable
      # license. The project is AGPL-3.0, so copyleft (GPL/LGPL/MPL) deps are
      # compatible and intentionally NOT disallowed; "forbidden" catches truly
      # incompatible/proprietary licenses and "unknown" forces a human to
      # classify anything go-licenses can't detect before it ships.
      - name: check dependency licenses
        run: |
          go-licenses check ./... \
            --disallowed_types=forbidden,unknown \
            --ignore github.com/grafana/network-topology-exporter

  helm-lint:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.22.0

      - name: helm lint
        run: helm lint deploy/helm/topology-exporter/

      - name: helm template (default values)
        run: helm template test deploy/helm/topology-exporter/ > /dev/null

      - name: helm template (all features enabled)
        run: |
          helm template test deploy/helm/topology-exporter/ \
            --set persistence.enabled=true \
            --set serviceMonitor.enabled=true \
            --set prometheusRule.enabled=true \
            --set service.hubEnabled=true \
            > /dev/null

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: [build-test, lint]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: docker build (no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: network-topology-exporter:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}

  e2e-test:
    name: e2e tests (containerlab)
    runs-on: ubuntu-latest
    # Run on main-branch pushes only — LLDP convergence wait (45 s) makes this
    # too slow for every PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.4'
          cache: false

      - name: install containerlab
        run: bash -c "$(curl -sL https://get.containerlab.dev)"

      - name: build test node image
        run: docker build -t nte-testnode:latest tests/e2e/testnode/

      - name: e2e tests
        run: CLAB_SUDO=1 go test ./tests/e2e/... -tags e2e -v -count=1 -timeout 15m

  e2e-test-srl:
    name: e2e tests (SR Linux)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.4'
          cache: false

      - name: install containerlab
        run: bash -c "$(curl -sL https://get.containerlab.dev)"

      - name: pull SR Linux image
        run: docker pull ghcr.io/nokia/srlinux:26.3.2

      - name: e2e tests (SR Linux)
        run: CLAB_SUDO=1 go test ./tests/e2e/srl/... -tags e2e_srl -v -count=1 -timeout 20m

  scripts:
    name: scripts lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: install bats
        run: |
          sudo apt-get install -y bats
      - name: install python + ruff + pytest
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: install python deps
        run: pip install ruff==0.7.4 pytest==8.3.4
      - name: shellcheck
        if: hashFiles('scripts/colleague-capture-lib/*.sh', 'scripts/colleague-capture.sh', 'lab/*/colleague-capture.sh') != ''
        run: |
          set -e
          files=""
          [ -f scripts/colleague-capture.sh ] && files="$files scripts/colleague-capture.sh"
          for f in scripts/colleague-capture-lib/*.sh lab/*/colleague-capture.sh; do
            [ -f "$f" ] && files="$files $f"
          done
          if [ -n "$files" ]; then shellcheck $files; fi
      - name: ruff
        if: hashFiles('scripts/redact-snmp-capture.py') != ''
        run: ruff check scripts/redact-snmp-capture.py
      - name: bats
        if: hashFiles('tests/scripts/test_lib_*.bats') != ''
        run: bats tests/scripts/test_lib_*.bats
      - name: pytest
        if: hashFiles('tests/scripts/test_redact_snmp_capture.py') != ''
        run: pytest tests/scripts/test_redact_snmp_capture.py -v

  release:
    name: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, integration-test, lint, helm-lint, docker]
    env:
      REF_NAME: ${{ github.ref_name }}
      COMMIT_SHA: ${{ github.sha }}
      SBOM_FILE: network-topology-exporter-${{ github.ref_name }}.spdx.json
      OFFLINE_TARBALL: network-topology-exporter-${{ github.ref_name }}-offline.tar.gz
      OFFLINE_STAGING: offline/network-topology-exporter-${{ github.ref_name }}
    permissions:
      contents: write       # create GitHub release
      packages: write       # push to ghcr.io
      id-token: write       # OIDC for cosign keyless + SLSA attestations
      attestations: write   # write build-provenance attestations to GitHub
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.4'
          cache: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: build and push
        id: build_push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}

      - name: sign container image (cosign keyless)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build_push.outputs.digest }}
        run: |
          for tag in ${TAGS}; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      - name: attest container image build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build_push.outputs.digest }}
          push-to-registry: true

      - name: go build release binaries
        env:
          REF_NAME: ${{ env.REF_NAME }}
          COMMIT_SHA: ${{ env.COMMIT_SHA }}
        run: |
          mkdir -p bin
          LDFLAGS="-s -w \
            -X github.com/grafana/network-topology-exporter/internal/version.Version=${REF_NAME} \
            -X github.com/grafana/network-topology-exporter/internal/version.Commit=${COMMIT_SHA} \
            -X github.com/grafana/network-topology-exporter/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" \
            -o bin/topology-exporter-linux-amd64 ./cmd/topology-exporter
          CGO_ENABLED=0 GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" \
            -o bin/topology-exporter-linux-arm64 ./cmd/topology-exporter

      - name: sign release binaries (cosign keyless)
        run: |
          for f in bin/topology-exporter-linux-amd64 bin/topology-exporter-linux-arm64; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.cert" \
              "${f}"
          done

      - name: attest binary build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            bin/topology-exporter-linux-amd64
            bin/topology-exporter-linux-arm64

      # SBOM (SPDX) for the published image — the third leg of the supply-chain
      # story alongside cosign signatures and SLSA provenance. Generated with
      # syft (via anchore/sbom-action), attested to the registry as an in-toto
      # SPDX predicate, signed as a blob, and attached to the release + the
      # offline tarball.
      - name: generate image SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build_push.outputs.digest }}
          format: spdx-json
          output-file: ${{ env.SBOM_FILE }}
          upload-artifact: false
          upload-release-assets: false

      - name: attest image SBOM
        env:
          DIGEST: ${{ steps.build_push.outputs.digest }}
          SBOM: ${{ env.SBOM_FILE }}
        run: |
          cosign attest --yes --type spdxjson --predicate "${SBOM}" \
            "ghcr.io/${{ github.repository }}@${DIGEST}"

      - name: sign SBOM (cosign keyless)
        env:
          SBOM: ${{ env.SBOM_FILE }}
        run: |
          cosign sign-blob --yes \
            --output-signature "${SBOM}.sig" \
            --output-certificate "${SBOM}.cert" \
            "${SBOM}"

      # Offline install bundle for air-gapped / proxy-restricted shops that
      # cannot reach ghcr.io. Contains the static binaries plus
      # their cosign sigs/certs, the example config, the Helm chart, and the
      # Helm-free Kustomize overlay tree.
      - name: assemble offline tarball
        env:
          TARBALL: ${{ env.OFFLINE_TARBALL }}
          STAGING_DIR: ${{ env.OFFLINE_STAGING }}
          SBOM_FILE: ${{ env.SBOM_FILE }}
          REF_NAME: ${{ env.REF_NAME }}
        run: |
          staging="${STAGING_DIR}"
          mkdir -p "${staging}/bin" "${staging}/config" "${staging}/deploy"
          cp bin/topology-exporter-linux-amd64 \
             bin/topology-exporter-linux-amd64.sig \
             bin/topology-exporter-linux-amd64.cert \
             bin/topology-exporter-linux-arm64 \
             bin/topology-exporter-linux-arm64.sig \
             bin/topology-exporter-linux-arm64.cert \
             "${staging}/bin/"
          cp config/example.yaml "${staging}/config/"
          cp "${SBOM_FILE}" "${staging}/"
          cp -R deploy/helm/topology-exporter "${staging}/deploy/helm-chart"
          cp -R deploy/kustomize "${staging}/deploy/kustomize"
          tar -czf "${TARBALL}" -C offline "network-topology-exporter-${REF_NAME}"

      - name: sign offline tarball (cosign keyless)
        env:
          TARBALL: ${{ env.OFFLINE_TARBALL }}
        run: |
          cosign sign-blob --yes \
            --output-signature "${TARBALL}.sig" \
            --output-certificate "${TARBALL}.cert" \
            "${TARBALL}"

      - name: create github release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            bin/topology-exporter-linux-amd64
            bin/topology-exporter-linux-amd64.sig
            bin/topology-exporter-linux-amd64.cert
            bin/topology-exporter-linux-arm64
            bin/topology-exporter-linux-arm64.sig
            bin/topology-exporter-linux-arm64.cert
            ${{ env.OFFLINE_TARBALL }}
            ${{ env.OFFLINE_TARBALL }}.sig
            ${{ env.OFFLINE_TARBALL }}.cert
            ${{ env.SBOM_FILE }}
            ${{ env.SBOM_FILE }}.sig
            ${{ env.SBOM_FILE }}.cert
          generate_release_notes: true
