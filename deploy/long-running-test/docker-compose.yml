services:
  topology-exporter:
    image: network-topology-exporter:latest
    container_name: long-running-exporter
    volumes:
      - ./config.yaml:/etc/topology-exporter/config.yaml:ro
      - exporter-data:/var/lib/network-topology-exporter
    environment:
      - SNMP_COMMUNITY=${SNMP_COMMUNITY:-public}
    ports:
      - "9100:9100"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    container_name: long-running-alloy
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12346:12345" # Alloy UI
      - "4319:4317"   # OTLP gRPC
      - "4320:4318"   # OTLP HTTP
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    environment:
      - ALLOY_DEPLOY_MODE=docker
      - GRAFANA_CLOUD_TOKEN
      - GRAFANA_PROM_USER
      - GRAFANA_LOKI_USER
      - GRAFANA_TEMPO_USER
    restart: unless-stopped

  mutator:
    image: alpine:latest@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    container_name: long-running-mutator
    volumes:
      - .:/work
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/containerlab:/usr/local/bin/containerlab:ro
    working_dir: /work
    network_mode: host
    pid: host
    privileged: true
    environment:
      - TARGET_PWD=${PWD}
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache bash docker-cli yq && ./mutate.sh"]
    restart: unless-stopped

volumes:
  exporter-data:
