# Default values for topology-exporter.
# Modes: standalone (default), uncoordinated, spoke, hub.
# See docs/operator/federation.md for multi-instance federation setup.

replicaCount: 1

image:
  repository: network-topology-exporter
  # Image used when config.federation.role is "hub" (docs/proposals/
  # core-hub-split.md §3). The hub is now built and shipped as a separate
  # binary/image (cmd/topology-hub, Dockerfile.hub) so that only it links
  # k8s.io/client-go, needed for the opt-in native-HA leader election —
  # every other role keeps using `repository` above.
  hubRepository: network-topology-hub
  tag: ""  # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9100"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  port: 9100
  # Hub mode: expose the spoke-push listener separately.
  hubPort: 9101
  hubEnabled: false

# Prometheus ServiceMonitor (requires prometheus-operator).
serviceMonitor:
  enabled: false
  namespace: ""
  interval: 60s
  scrapeTimeout: 30s
  labels: {}

# PrometheusRule for the recommended alerts (requires prometheus-operator).
prometheusRule:
  enabled: false
  namespace: ""
  labels: {}
  # Discovery cycle slower than this threshold triggers the p99 alert.
  cycleThresholdSeconds: 60

# A CPU limit is intentionally omitted. Discovery is bursty (periodic cycles),
# and a CPU limit would invite CFS throttling that stretches cycle latency for
# no real benefit on a small workload. The request sets the scheduler floor;
# memory keeps a hard limit to bound blast radius. Add a cpu limit here only if
# a namespace ResourceQuota / LimitRange forces one. (#122)
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# /healthz returns 503 once the discovery loop has gone stale (no completed
# cycle within discovery.interval × discovery.liveness_max_stale_cycles), so a
# wedged loop is restarted by Kubernetes. Set discovery.liveness_max_stale_cycles
# in the exporter config (default 3) and size failureThreshold × periodSeconds so
# a transiently slow cycle does not cause a needless restart. The gate is inert
# for federation.role: hub (no local discovery loop).
livenessProbe:
  httpGet:
    path: /healthz
    port: metrics
  initialDelaySeconds: 15
  periodSeconds: 30
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: metrics
  initialDelaySeconds: 5
  periodSeconds: 10

# Snapshot persistence. If persistence is enabled a PVC is created and
# mounted at /var/lib/topology-exporter. The snapshot path in config must
# match this mount point.
persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 100Mi
  existingClaim: ""

# Federation TLS secrets. Set secretName to the name of an existing Secret
# that contains tls.crt, tls.key, and ca.crt. The chart mounts it at
# /etc/topology-exporter/pki/. Required for spoke and hub modes.
federation:
  tlsSecret: ""
  # Native hub high-availability (issue #71). Opt-in; OFF by default keeps the
  # single-hub behaviour byte-identical to a non-HA deploy. When enabled, run
  # replicaCount >= 2 hub replicas: they elect one leader via a Kubernetes Lease
  # (coordination.k8s.io), and only the leader accepts spoke pushes and serves
  # authoritative /metrics. Enabling this renders the leader-election RBAC
  # (Role + RoleBinding), a headless metrics Service that scrapes all replicas,
  # the downward-API pod identity env vars, and mounts the ServiceAccount token.
  hub:
    ha:
      enabled: false
      # Name of the coordination.k8s.io Lease used for election. All hub
      # replicas of one release must share this name.
      leaseName: topology-exporter-hub
      # How long a non-leader waits before it may acquire an unrenewed Lease.
      leaseDuration: 15s
      # The leader must renew within this window or it steps down. Must be
      # strictly less than leaseDuration.
      renewDeadline: 10s
      # How often a non-leader retries acquiring the Lease. Must be > 0 and
      # less than renewDeadline.
      retryPeriod: 2s
      # When true the snapshot volume is treated as shared (RWX) so a freshly
      # elected leader warm-starts from the previous leader's snapshot. Optional
      # — the default HA path cold-starts and rebuilds within one discovery
      # interval. REQUIRES a ReadWriteMany PVC (NFS/CephFS/EFS/Filestore); most
      # default StorageClasses are RWO and will NOT work with replicaCount > 1.
      snapshotShared: false

# config is the full topology-exporter configuration document.
# Override individual keys or replace the whole block.
config:
  discovery:
    interval: 60s
    timeout_per_device: 10s
    parallelism: 20
    unconfirmed_link_ttl_cycles: 3
    scope:
      cidr_allow_list: []

  modules:
    snmp:
      enabled: true
      version: v2c
    lldp:
      enabled: true
    cdp:
      enabled: true
    bgp:
      enabled: false
    ospf:
      enabled: false
    fdb:
      enabled: false

  credentials:
    profiles: []
    assignments: []
    fallback_order: []
    trial_rate_per_second: 5

  snapshot:
    path: /var/lib/topology-exporter/snapshot.json

  federation:
    role: standalone
    spoke_timeout: 3m
    known_inter_domain_links: []

  targets: []

# Extra environment variables to inject (e.g. SNMP community string secrets).
extraEnv: []
# - name: SNMP_COMMUNITY
#   valueFrom:
#     secretKeyRef:
#       name: snmp-secret
#       key: community

# Extra volumes and mounts for custom cert bundles, credential files, etc.
extraVolumes: []
extraVolumeMounts: []

pdb:
  enabled: false
  maxUnavailable: 0

networkPolicy:
  enabled: false
  # Labels that spoke pods must carry to be allowed ingress on the hub port.
  # Example: topology-exporter/role: spoke
  spokeSelector: {}
  # Opt-in egress restriction. Default (disabled) keeps the policy Ingress-only.
  # When enabled, policyTypes gains Egress and ONLY the rules below are allowed —
  # all other outbound traffic is denied. A credential-bearing whole-network SNMP
  # scanner has no business reaching arbitrary destinations, so locking egress
  # limits the blast radius if the pod is compromised. You MUST enumerate every
  # destination the exporter legitimately needs, or it will break.
  #
  # Enabling egress requires at least one destination: when egress.enabled is
  # true the chart FAILS to render unless one of snmp.cidrs / otlp.cidrs /
  # hub.cidrs / extraRules is set, because a DNS-only egress policy would
  # silently deny all SNMP discovery.
  egress:
    enabled: false
    # DNS resolution (kube-dns / CoreDNS). Almost always required. Allows
    # UDP+TCP 53 egress, scoped via namespaceSelector to dnsNamespace below.
    allowDNS: true
    # Namespace the cluster DNS service runs in. Matched on the standard
    # kubernetes.io/metadata.name label. Override for non-standard clusters.
    dnsNamespace: kube-system
    # SNMP polling targets — typically your discovery scope
    # (config.discovery.scope.cidr_allow_list).
    snmp:
      cidrs: [] # e.g. ["10.0.0.0/8"]
      ports: [161]
    # OTLP traces/metrics collector endpoint.
    otlp:
      cidrs: [] # e.g. ["10.96.0.10/32"]
      ports: [4317]
    # Hub federation peers (spoke → hub push). Hub-side acceptance is ingress.
    hub:
      cidrs: [] # e.g. ["10.0.0.0/8"]
      ports: [9101]
    # Escape hatch: extra raw NetworkPolicy egress entries, rendered verbatim.
    extraRules: []

nodeSelector: {}
tolerations: []
affinity: {}
